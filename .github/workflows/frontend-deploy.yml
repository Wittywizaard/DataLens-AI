name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
      
      - name: Build
        run: |
          cd frontend
          npm run build
          echo "Build completed successfully"
      
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Error: VERCEL_TOKEN is not set"
            exit 1
          fi
          
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Warning: VERCEL_ORG_ID or VERCEL_PROJECT_ID not set"
            echo "Attempting deployment without org/project IDs..."
          fi
          
          cd frontend
          
          # Try deployment with org and project IDs if available
          if [ ! -z "$VERCEL_ORG_ID" ] && [ ! -z "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying with org and project context..."
            vercel deploy --prod \
              --token=$VERCEL_TOKEN \
              --scope=$VERCEL_ORG_ID \
              --confirm
          else
            echo "Deploying with token only..."
            vercel deploy --prod --token=$VERCEL_TOKEN --confirm
          fi
