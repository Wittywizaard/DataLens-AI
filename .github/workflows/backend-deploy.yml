name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check Render Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  Missing RENDER_DEPLOY_HOOK secret. Setup guide:"
            echo "1. Go to Render dashboard → Select backend service"
            echo "2. Settings → Deploy Hooks → Copy the webhook URL"
            echo "3. Add to GitHub Secrets as RENDER_DEPLOY_HOOK"
            exit 1
          fi
      
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "✅ Render deployment triggered"
