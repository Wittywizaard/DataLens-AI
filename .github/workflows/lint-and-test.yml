name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
      
      - name: Check for syntax errors
        run: |
          cd frontend
          npm run build 2>&1 || echo "⚠️  Build check completed"

  lint-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      
      - name: Check syntax
        run: |
          cd backend
          node -c server.js
          echo "✅ Backend syntax valid"
          node -c routes/auth.js
          node -c routes/upload.js
          node -c routes/analyze.js
          echo "✅ All route files valid"
