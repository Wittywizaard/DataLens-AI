app = "datalens-ai-backend"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  FRONTEND_URL = "https://your-frontend.vercel.app"

[[services]]
  internal_port = 3001
  protocol = "tcp"

  [[services.ports]]
    port = "80"

  [services.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25
